<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمایش آب و هوای شهرهای ایران</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        h1 {
            font-size: 24px;
            color: #333;
        }
        input {
            padding: 10px;
            margin: 10px 0;
            width: 80%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #weather-info {
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مشاهده لحظه‌ای آب‌و‌هوا</h1>
    <div class="meta-info">ساخته شده توسط تیم خرداد</div>
        <input type="text" id="city" placeholder="نام شهر (مثل تهران)">
        <button onclick="getWeather()">نمایش آب و هوا</button>
        <div id="weather-info"></div>
    </div>

    <script>
        const apiKey = "e11998d0169627a85ff216bc584165c0"; // کلید API خودت رو از OpenWeatherMap اینجا بذار
        const weatherInfo = document.getElementById("weather-info");

        function getWeather() {
            const city = document.getElementById("city").value;
            if (!city) {
                weatherInfo.innerHTML = "لطفاً نام شهر را وارد کنید!";
                return;
            }

            const url = `https://api.openweathermap.org/data/2.5/weather?q=${city},IR&appid=${apiKey}&units=metric&lang=fa`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.cod === 200) {
                        const temp = data.main.temp;
                        const description = data.weather[0].description;
                        const cityName = data.name;
                        weatherInfo.innerHTML = `
                            <p>شهر: ${cityName}</p>
                            <p>دما: ${temp}°C</p>
                            <p>وضعیت: ${description}</p>
                        `;
                    } else {
                        weatherInfo.innerHTML = "شهر یافت نشد! لطفاً نام شهر را درست وارد کنید.";
                    }
                })
                .catch(error => {
                    weatherInfo.innerHTML = "خطایی رخ داد. لطفاً دوباره تلاش کنید.";
                    console.error(error);
                });
        }
    </script>
</body>
</html>
