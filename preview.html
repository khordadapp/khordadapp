.loader {
  position: absolute;
  top: 50%;
  left: 50%;

}

.loader-inner {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background-color: #fff;
  animation: loader-animation 1s infinite ease-in-out;
}

@keyframes loader-animation {
  0% {
    transform: scale(0);
    opacity: 0.5;
  }
  
  50% {
    transform: scale(1);
    opacity: 1;
  }
  
  100% {
    transform: scale(0);
    opacity: 0.5;
  }
}

/* Hide loader after 5 seconds */
.loader {
  animation: hide-loader 17s forwards;
}

@keyframes hide-loader {
  to {
    opacity: 0;
    visibility: hidden;
  }
}
</style>
