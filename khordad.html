<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>خرداد</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
    background: #fff;
    color: #202124;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 20px 28px;
    gap: 18px;
    font-size: 14px;
  }
  header a { color: #202124; text-decoration: none; }
  header .btn {
    background: #1a73e8;
    color: #fff;
    padding: 8px 20px;
    border-radius: 4px;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-top: -60px;
  }
  .logo {
    font-size: 84px;
    font-weight: bold;
    margin-bottom: 25px;
    letter-spacing: 2px;
  }
  .logo span:nth-child(1){color:#4285F4;}
  .logo span:nth-child(2){color:#EA4335;}
  .logo span:nth-child(3){color:#FBBC05;}
  .logo span:nth-child(4){color:#4285F4;}
  .logo span:nth-child(5){color:#34A853;}
  .logo span:nth-child(6){color:#EA4335;}
  form { width: 100%; display:flex; flex-direction:column; align-items:center; }
  .search-box {
    width: 92%;
    max-width: 580px;
    display: flex;
    align-items: center;
    border: 1px solid #dfe1e5;
    border-radius: 24px;
    padding: 10px 18px;
    box-shadow: 0 1px 6px rgba(32,33,36,0.15);
    transition: box-shadow .2s;
  }
  .search-box:hover, .search-box:focus-within { box-shadow: 0 2px 10px rgba(32,33,36,0.28); }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    background: transparent;
    color: #202124;
    padding: 0 8px;
  }
  .search-box .icon { color:#4285F4; font-size:18px; }
  .search-box .mic { color:#4285F4; font-size:18px; cursor:pointer; }
  .buttons {
    margin-top: 26px;
    display: flex;
    gap: 12px;
  }
  .buttons button {
    background: #f8f9fa;
    border: 1px solid #f8f9fa;
    border-radius: 4px;
    color: #3c4043;
    font-size: 14px;
    padding: 9px 16px;
    cursor: pointer;
  }
  .buttons button:hover {
    box-shadow: 0 1px 1px rgba(0,0,0,0.1);
    border: 1px solid #dadce0;
  }
  .langs { margin-top: 22px; font-size: 13px; color:#202124; }
  .langs a { color: #1a73e8; text-decoration:none; margin: 0 4px; }
  footer {
    background: #f2f2f2;
    font-size: 13px;
    color: #70757a;
  }
  footer .row {
    display: flex;
    justify-content: space-between;
    padding: 14px 28px;
    flex-wrap: wrap;
  }
  footer a { color: #70757a; text-decoration: none; margin: 0 10px; }
  footer .top { border-bottom: 1px solid #ddd; padding: 12px 28px; font-size:13px;}
  #saveNote {
    text-align:center;
    font-size:12px;
    color:#70757a;
    margin-top:14px;
    min-height: 16px;
  }
</style>
</head>
<body>

<header>
  <a href="#">جیمیل</a>
  <a href="#">تصاویر</a>
  <button class="btn" type="button" onclick="alert('ورود به حساب کاربری خرداد')">ورود</button>
</header>

<main>
  <div class="logo">
    <span>خ</span><span>ر</span><span>د</span><span>ا</span><span>د</span>
  </div>

  <form id="searchForm" onsubmit="return doSearch(event)">
    <div class="search-box">
      <span class="icon">🔍</span>
      <input id="q" type="text" placeholder="جستجو در خرداد یا وارد کردن نشانی وب" autofocus>
      <span class="mic" title="جستجوی صوتی" onclick="alert('جستجوی صوتی خرداد')">🎤</span>
    </div>
    <div class="buttons">
      <button type="submit">جستجو در خرداد</button>
      <button type="button" onclick="feelingLucky()">شانس امروز خودم را می‌آزمایم</button>
    </div>
  </form>

  <div class="langs">
    خرداد به این زبان‌ها ارائه می‌شود:
    <a href="#">فارسی</a> <a href="#">English</a> <a href="#">العربية</a>
  </div>
  <div id="saveNote"></div>
</main>

<footer>
  <div class="top">ایران</div>
  <div class="row">
    <div>
      <a href="#">درباره خرداد</a>
      <a href="#">تبلیغات</a>
      <a href="#">کسب‌وکار</a>
    </div>
    <div>
      <a href="#">حریم خصوصی</a>
      <a href="#">شرایط استفاده</a>
      <a href="#" onclick="showHistory(event)">تاریخچه جستجو</a>
    </div>
  </div>
</footer>

<script>
// ذخیره‌سازی تاریخچه جستجو در حافظه محلی مرورگر (localStorage)
function saveSearch(term) {
  let history = JSON.parse(localStorage.getItem('khordad_history') || '[]');
  history.unshift({ term: term, time: new Date().toLocaleString('fa-IR') });
  history = history.slice(0, 50); // فقط ۵۰ جستجوی آخر ذخیره می‌شود
  localStorage.setItem('khordad_history', JSON.stringify(history));
}

function doSearch(e) {
  e.preventDefault();
  const term = document.getElementById('q').value.trim();
  if (!term) return false;
  saveSearch(term);
  document.getElementById('saveNote').textContent = 'جستجوی «' + term + '» در تاریخچه خرداد ذخیره شد.';
  // هدایت به نتایج جستجوی واقعی گوگل در تب جدید (چون خرداد یک موتور جستجوی نمایشی است)
  window.open('https://www.google.com/search?q=' + encodeURIComponent(term), '_blank');
  return false;
}

function feelingLucky() {
  const term = document.getElementById('q').value.trim();
  if (!term) { alert('اول یک عبارت برای جستجو بنویسید.'); return; }
  saveSearch(term);
  window.open('https://www.google.com/search?q=' + encodeURIComponent(term) + '&btnI=1', '_blank');
}

function showHistory(e) {
  e.preventDefault();
  const history = JSON.parse(localStorage.getItem('khordad_history') || '[]');
  if (history.length === 0) {
    alert('تاریخچه جستجوی خرداد خالی است.');
    return;
  }
  const list = history.map(h => '• ' + h.term + '  (' + h.time + ')').join('\n');
  alert('تاریخچه جستجوی خرداد:\n\n' + list);
}
</script>

</body>
</html>
