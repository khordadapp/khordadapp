<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمایش زنده بازی‌های فوتبال</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .filter-section {
            margin-bottom: 20px;
            text-align: center;
        }
        select, input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .match-list {
            display: grid;
            gap: 15px;
        }
        .match-card {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
        }
        .match-card:hover {
            transform: scale(1.02);
        }
        .match-info {
            flex: 1;
        }
        .match-stats {
            text-align: left;
            font-size: 14px;
            color: #555;
        }
        .live-badge {
            background-color: #dc3545;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>نمایش زنده بازی‌های فوتبال</h1>
        <div class="filter-section">
            <select id="league">
                <option value="">همه لیگ‌ها</option>
                <option value="persian-gulf">لیگ خلیج فارس</option>
                <option value="laliga">لالیگا</option>
                <option value="premier-league">پریمیر لیگ</option>
            </select>
            <input type="text" id="team" placeholder="جستجوی تیم (مثل پرسپولیس)">
            <button onclick="fetchMatches()">نمایش بازی‌ها</button>
        </div>
        <div id="match-list" class="match-list"></div>
    </div>

    <script>
        const apiKey = "YOUR_API_KEY"; // کلید API خودت رو اینجا بذار
        const matchList = document.getElementById("match-list");

        // داده‌های نمونه (برای تست بدون API واقعی)
        const mockData = [
            {
                id: 1,
                league: "persian-gulf",
                teams: "پرسپولیس - استقلال",
                score: "2 - 1",
                status: "LIVE",
                time: "45'",
                stats: { shots: "10 - 8", possession: "55% - 45%", cards: "2 - 1" }
            },
            {
                id: 2,
                league: "laliga",
                teams: "بارسلونا - رئال مادرید",
                score: "0 - 0",
                status: "LIVE",
                time: "30'",
                stats: { shots: "7 - 5", possession: "60% - 40%", cards: "0 - 1" }
            },
            {
                id: 3,
                league: "premier-league",
                teams: "منچستر یونایتد - لیورپول",
                score: "1 - 1",
                status: "LIVE",
                time: "60'",
                stats: { shots: "12 - 9", possession: "50% - 50%", cards: "3 - 2" }
            }
        ];

        function fetchMatches() {
            const league = document.getElementById("league").value;
            const team = document.getElementById("team").value.toLowerCase().trim();

            // اگر API واقعی داشتی، اینجا fetch می‌کردی:
            /*
            const url = `https://api.football-data.org/v4/matches?competitions=${league}&apiKey=${apiKey}`;
            fetch(url, { headers: { "X-Auth-Token": apiKey } })
                .then(response => response.json())
                .then(data => displayMatches(data.matches, team))
                .catch(error => {
                    matchList.innerHTML = `<p>خطایی رخ داد: ${error.message}</p>`;
                    console.error(error);
                });
            */

            // برای تست، از داده‌های نمونه استفاده می‌کنیم
            displayMatches(mockData, team);
        }

        function displayMatches(matches, teamFilter) {
            matchList.innerHTML = "";
            const filteredMatches = matches.filter(match => 
                (!teamFilter || match.teams.toLowerCase().includes(teamFilter)) &&
                (!document.getElementById("league").value || match.league === document.getElementById("league").value)
            );

            if (filteredMatches.length === 0) {
                matchList.innerHTML = "<p>هیچ بازی‌ای یافت نشد!</p>";
                return;
            }

            filteredMatches.forEach(match => {
                const matchCard = document.createElement("div");
                matchCard.className = "match-card";
                matchCard.innerHTML = `
                    <div class="match-info">
                        <h3>${match.teams}</h3>
                        <p>امتیاز: ${match.score}</p>
                        <p>زمان: ${match.time} <span class="live-badge">${match.status}</span></p>
                    </div>
                    <div class="match-stats">
                        <p>شوت‌ها: ${match.stats.shots}</p>
                        <p>مالکیت: ${match.stats.possession}</p>
                        <p>کارت‌ها: ${match.stats.cards}</p>
                    </div>
                `;
                matchList.appendChild(matchCard);
            });
        }

        // آپدیت خودکار هر 30 ثانیه (برای شبیه‌سازی داده‌های زنده)
        setInterval(fetchMatches, 30000);
        // بارگذاری اولیه
        fetchMatches();
    </script>
</body>
</html>
