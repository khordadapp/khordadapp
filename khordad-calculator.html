<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خرداد ماشین‌حساب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --bg: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-btn: rgba(51, 65, 85, 0.7);
            --bg-btn-hover: rgba(71, 85, 105, 0.9);
            --bg-display: rgba(15, 23, 42, 0.6);
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: rgba(148, 163, 184, 0.15);
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --operator: #f97316;
            --equals: #6366f1;
            --radius: 20px;
            --radius-sm: 14px;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg: #e2e8f0;
            --bg-card: rgba(255, 255, 255, 0.9);
            --bg-btn: rgba(241, 245, 249, 0.9);
            --bg-btn-hover: #e2e8f0;
            --bg-display: rgba(248, 250, 252, 0.95);
            --text: #0f172a;
            --text-secondary: #64748b;
            --border: rgba(100, 116, 139, 0.2);
            --primary-glow: rgba(99, 102, 241, 0.2);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: var(--transition);
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(236, 72, 153, 0.1) 0%, transparent 40%),
                radial-gradient(ellipse at 60% 80%, rgba(34, 197, 94, 0.08) 0%, transparent 40%);
        }

        .app {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            border-radius: 28px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: var(--transition);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 22px 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--primary);
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border: none;
            background: var(--bg-btn);
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .icon-btn:hover {
            background: var(--bg-btn-hover);
            color: var(--text);
            transform: scale(1.05);
        }

        .icon-btn.active {
            background: var(--primary);
            color: white;
        }

        /* Mode Tabs */
        .mode-tabs {
            display: flex;
            gap: 6px;
            padding: 0 22px 14px;
        }

        .mode-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: var(--bg-btn);
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }

        .mode-tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        /* Display */
        .display-area {
            padding: 8px 22px 18px;
        }

        .expression {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            color: var(--text-secondary);
            text-align: left;
            direction: ltr;
            min-height: 24px;
            overflow-x: auto;
            white-space: nowrap;
            padding: 0 4px;
            margin-bottom: 6px;
        }

        .expression::-webkit-scrollbar { height: 0; }

        .display {
            background: var(--bg-display);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            border: 1px solid var(--border);
            text-align: left;
            direction: ltr;
            overflow: hidden;
        }

        .current-input {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.4rem;
            font-weight: 600;
            color: var(--text);
            word-break: break-all;
            line-height: 1.2;
            min-height: 1.3em;
            transition: font-size 0.15s ease;
        }

        .current-input.small {
            font-size: 1.6rem;
        }

        .current-input.tiny {
            font-size: 1.2rem;
        }

        /* Memory Indicator */
        .memory-badge {
            display: inline-block;
            background: var(--primary);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            opacity: 0;
            transition: var(--transition);
        }

        .memory-badge.show {
            opacity: 1;
        }

        /* Keypad */
        .keypad {
            padding: 0 16px 20px;
            display: grid;
            gap: 10px;
        }

        .keypad.standard {
            grid-template-columns: repeat(4, 1fr);
        }

        .keypad.scientific {
            grid-template-columns: repeat(5, 1fr);
        }

        .key {
            aspect-ratio: 1.25;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-btn);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .key:hover {
            background: var(--bg-btn-hover);
            transform: translateY(-2px);
        }

        .key:active {
            transform: scale(0.95);
        }

        .key.number {
            font-size: 1.35rem;
        }

        .key.operator {
            color: var(--operator);
            font-size: 1.4rem;
        }

        .key.equals {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 4px 16px var(--primary-glow);
        }

        .key.equals:hover {
            box-shadow: 0 6px 20px var(--primary-glow);
            filter: brightness(1.1);
        }

        .key.function {
            font-size: 0.95rem;
            color: var(--primary);
        }

        .key.danger {
            color: var(--danger);
        }

        .key.wide {
            grid-column: span 2;
            aspect-ratio: auto;
            height: auto;
            min-height: 52px;
        }

        .keypad.scientific .key {
            font-size: 0.95rem;
            aspect-ratio: 1.15;
        }

        .keypad.scientific .key.number {
            font-size: 1.15rem;
        }

        .keypad.scientific .key.operator {
            font-size: 1.2rem;
        }

        /* History Panel */
        .history-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
            border-top: 1px solid transparent;
        }

        .history-panel.open {
            max-height: 280px;
            border-top-color: var(--border);
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 22px 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .history-list {
            padding: 0 16px 16px;
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            background: var(--bg-btn);
            border-radius: 12px;
            padding: 10px 14px;
            cursor: pointer;
            transition: var(--transition);
            direction: ltr;
            text-align: left;
        }

        .history-item:hover {
            background: var(--bg-btn-hover);
        }

        .history-expr {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .history-result {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
        }

        .empty-history {
            text-align: center;
            padding: 24px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 0 22px 16px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .toast {
            background: var(--bg-card);
            color: var(--text);
            padding: 12px 22px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            font-size: 0.9rem;
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            animation: toastIn 0.3s ease;
            white-space: nowrap;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        .history-list::-webkit-scrollbar {
            width: 5px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* Responsive */
        @media (max-width: 400px) {
            .current-input {
                font-size: 2rem;
            }
            .key {
                font-size: 1.1rem;
            }
            .keypad.scientific .key {
                font-size: 0.85rem;
            }
        }

        @media (min-width: 500px) {
            .app {
                max-width: 460px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon">خ</div>
                <span>خرداد</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="historyBtn" title="تاریخچه">📜</button>
                <button class="icon-btn" id="themeBtn" title="حالت روشن/تاریک">☀️</button>
                <button class="icon-btn" id="copyBtn" title="کپی نتیجه">📋</button>
            </div>
        </div>

        <!-- Mode Tabs -->
        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="standard">استاندارد</button>
            <button class="mode-tab" data-mode="scientific">علمی</button>
        </div>

        <!-- Display -->
        <div class="display-area">
            <div class="memory-badge" id="memoryBadge">M</div>
            <div class="expression" id="expression"></div>
            <div class="display">
                <div class="current-input" id="display">۰</div>
            </div>
        </div>

        <!-- History Panel -->
        <div class="history-panel" id="historyPanel">
            <div class="history-header">
                <span>تاریخچه محاسبات</span>
                <button class="icon-btn" id="clearHistoryBtn" title="پاک کردن تاریخچه" style="width:32px;height:32px;font-size:0.9rem;">🗑️</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>

        <!-- Keypad -->
        <div class="keypad standard" id="keypad">
            <!-- Will be rendered by JS -->
        </div>

        <div class="footer">خرداد ماشین‌حساب • همه داده‌ها محلی ذخیره می‌شوند</div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ==================== State ====================
        const STORAGE = {
            history: 'khordad_calc_history',
            memory: 'khordad_calc_memory',
            theme: 'khordad_calc_theme',
            mode: 'khordad_calc_mode'
        };

        let currentInput = '0';
        let expression = '';
        let lastResult = null;
        let shouldResetInput = false;
        let memory = 0;
        let history = [];
        let mode = 'standard'; // standard | scientific
        let isDegree = true; // for trig functions

        // ==================== Utilities ====================
        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2200);
        }

        function toPersian(num) {
            return String(num).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }

        function toEnglish(str) {
            return String(str).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
        }

        function formatDisplay(value) {
            if (value === 'Error' || value === 'Infinity' || value === '-Infinity') return value;
            let str = String(value);
            // Limit length
            if (str.length > 14 && str.includes('e')) {
                return Number(value).toExponential(6);
            }
            if (str.length > 16) {
                return Number(value).toPrecision(12);
            }
            return str;
        }

        // ==================== Storage ====================
        function loadData() {
            try {
                history = JSON.parse(localStorage.getItem(STORAGE.history) || '[]');
                memory = parseFloat(localStorage.getItem(STORAGE.memory) || '0') || 0;
                const theme = localStorage.getItem(STORAGE.theme);
                if (theme === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    document.getElementById('themeBtn').textContent = '🌙';
                }
                const savedMode = localStorage.getItem(STORAGE.mode);
                if (savedMode === 'scientific') {
                    mode = 'scientific';
                    document.querySelectorAll('.mode-tab').forEach(t => {
                        t.classList.toggle('active', t.dataset.mode === 'scientific');
                    });
                }
                updateMemoryBadge();
            } catch (e) {
                console.error(e);
            }
        }

        function saveHistory() {
            localStorage.setItem(STORAGE.history, JSON.stringify(history.slice(0, 50)));
        }

        function saveMemory() {
            localStorage.setItem(STORAGE.memory, String(memory));
        }

        // ==================== Display ====================
        function updateDisplay() {
            const displayEl = document.getElementById('display');
            const exprEl = document.getElementById('expression');

            let displayValue = formatDisplay(currentInput);
            displayEl.textContent = toPersian(displayValue);

            // Adjust font size
            displayEl.classList.remove('small', 'tiny');
            if (displayValue.length > 12) displayEl.classList.add('small');
            if (displayValue.length > 18) displayEl.classList.add('tiny');

            exprEl.textContent = expression ? toPersian(expression) : '';
        }

        function updateMemoryBadge() {
            const badge = document.getElementById('memoryBadge');
            if (memory !== 0) {
                badge.classList.add('show');
            } else {
                badge.classList.remove('show');
            }
        }

        // ==================== Calculation Engine ====================
        function appendNumber(num) {
            if (shouldResetInput) {
                currentInput = num;
                shouldResetInput = false;
            } else {
                if (currentInput === '0' && num !== '.') {
                    currentInput = num;
                } else if (num === '.' && currentInput.includes('.')) {
                    return;
                } else {
                    if (currentInput.replace('.', '').length >= 16) return;
                    currentInput += num;
                }
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (currentInput === 'Error') return;

            if (shouldResetInput && expression && !expression.endsWith(' ')) {
                // Continue from last result
            }

            const ops = {
                '+': '+',
                '−': '−',
                '×': '×',
                '÷': '÷',
                '%': '%',
                '^': '^'
            };

            if (expression && !shouldResetInput) {
                expression += ' ' + currentInput + ' ' + (ops[op] || op);
            } else if (expression && shouldResetInput) {
                // Replace last operator if needed, or append
                expression = expression.replace(/\s[+\−×÷^%]\s*$/, '') + ' ' + (ops[op] || op);
            } else {
                expression = currentInput + ' ' + (ops[op] || op);
            }

            shouldResetInput = true;
            updateDisplay();
        }

        function calculate() {
            if (currentInput === 'Error') return;

            let expr = expression ? expression + ' ' + currentInput : currentInput;
            if (!expr.trim()) return;

            try {
                // Convert display operators to JS
                let jsExpr = expr
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/−/g, '-')
                    .replace(/\^/g, '**')
                    .replace(/%/g, '/100*');

                // Handle percentage more carefully in simple cases
                jsExpr = jsExpr.replace(/(\d+\.?\d*)\s*\/100\*/g, '($1/100)*');

                // Evaluate safely
                const result = Function('"use strict"; return (' + jsExpr + ')')();

                if (!isFinite(result)) {
                    throw new Error('Invalid');
                }

                // Round to avoid floating point issues
                const rounded = Math.round(result * 1e12) / 1e12;

                // Add to history
                addToHistory(expr, rounded);

                expression = '';
                currentInput = String(rounded);
                lastResult = rounded;
                shouldResetInput = true;
                updateDisplay();
            } catch (e) {
                currentInput = 'Error';
                expression = '';
                shouldResetInput = true;
                updateDisplay();
            }
        }

        function clearAll() {
            currentInput = '0';
            expression = '';
            shouldResetInput = false;
            updateDisplay();
        }

        function clearEntry() {
            currentInput = '0';
            shouldResetInput = false;
            updateDisplay();
        }

        function backspace() {
            if (shouldResetInput) return;
            if (currentInput.length <= 1 || currentInput === 'Error') {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        function toggleSign() {
            if (currentInput === '0' || currentInput === 'Error') return;
            if (currentInput.startsWith('-')) {
                currentInput = currentInput.slice(1);
            } else {
                currentInput = '-' + currentInput;
            }
            updateDisplay();
        }

        // Scientific functions
        function applyFunction(fn) {
            if (currentInput === 'Error') return;
            let val = parseFloat(currentInput);
            if (isNaN(val)) return;

            let result;
            const toRad = (d) => d * Math.PI / 180;
            const toDeg = (r) => r * 180 / Math.PI;

            try {
                switch (fn) {
                    case 'sin':
                        result = isDegree ? Math.sin(toRad(val)) : Math.sin(val);
                        break;
                    case 'cos':
                        result = isDegree ? Math.cos(toRad(val)) : Math.cos(val);
                        break;
                    case 'tan':
                        result = isDegree ? Math.tan(toRad(val)) : Math.tan(val);
                        break;
                    case 'asin':
                        result = isDegree ? toDeg(Math.asin(val)) : Math.asin(val);
                        break;
                    case 'acos':
                        result = isDegree ? toDeg(Math.acos(val)) : Math.acos(val);
                        break;
                    case 'atan':
                        result = isDegree ? toDeg(Math.atan(val)) : Math.atan(val);
                        break;
                    case 'log':
                        result = Math.log10(val);
                        break;
                    case 'ln':
                        result = Math.log(val);
                        break;
                    case 'sqrt':
                        result = Math.sqrt(val);
                        break;
                    case 'cbrt':
                        result = Math.cbrt(val);
                        break;
                    case 'sq':
                        result = val * val;
                        break;
                    case 'inv':
                        result = 1 / val;
                        break;
                    case 'fact':
                        if (val < 0 || !Number.isInteger(val) || val > 170) throw new Error();
                        result = 1;
                        for (let i = 2; i <= val; i++) result *= i;
                        break;
                    case 'abs':
                        result = Math.abs(val);
                        break;
                    case 'exp':
                        result = Math.exp(val);
                        break;
                    case 'pow10':
                        result = Math.pow(10, val);
                        break;
                    default:
                        return;
                }

                if (!isFinite(result)) throw new Error();

                const rounded = Math.round(result * 1e12) / 1e12;
                addToHistory(fn + '(' + currentInput + ')', rounded);
                currentInput = String(rounded);
                shouldResetInput = true;
                updateDisplay();
            } catch {
                currentInput = 'Error';
                shouldResetInput = true;
                updateDisplay();
            }
        }

        function insertConstant(c) {
            if (shouldResetInput || currentInput === '0') {
                currentInput = c === 'pi' ? String(Math.PI) : String(Math.E);
                shouldResetInput = false;
            } else {
                // Multiply by constant
                currentInput = String(parseFloat(currentInput) * (c === 'pi' ? Math.PI : Math.E));
            }
            updateDisplay();
        }

        // Memory
        function memoryAdd() {
            memory += parseFloat(currentInput) || 0;
            saveMemory();
            updateMemoryBadge();
            showToast('به حافظه اضافه شد');
        }

        function memorySub() {
            memory -= parseFloat(currentInput) || 0;
            saveMemory();
            updateMemoryBadge();
            showToast('از حافظه کم شد');
        }

        function memoryRecall() {
            currentInput = String(memory);
            shouldResetInput = true;
            updateDisplay();
        }

        function memoryClear() {
            memory = 0;
            saveMemory();
            updateMemoryBadge();
            showToast('حافظه پاک شد');
        }

        // ==================== History ====================
        function addToHistory(expr, result) {
            history.unshift({
                id: Date.now().toString(36),
                expr: expr,
                result: result,
                time: Date.now()
            });
            history = history.slice(0, 50);
            saveHistory();
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            if (history.length === 0) {
                list.innerHTML = '<div class="empty-history">هنوز محاسبه‌ای انجام نشده</div>';
                return;
            }
            list.innerHTML = history.map(h => `
                <div class="history-item" data-result="${h.result}">
                    <div class="history-expr">${toPersian(h.expr)} =</div>
                    <div class="history-result">${toPersian(formatDisplay(h.result))}</div>
                </div>
            `).join('');

            list.querySelectorAll('.history-item').forEach(el => {
                el.addEventListener('click', () => {
                    currentInput = el.dataset.result;
                    expression = '';
                    shouldResetInput = true;
                    updateDisplay();
                    showToast('نتیجه بارگذاری شد');
                });
            });
        }

        // ==================== Keypad Render ====================
        function renderKeypad() {
            const keypad = document.getElementById('keypad');
            keypad.className = 'keypad ' + mode;

            if (mode === 'standard') {
                keypad.innerHTML = `
                    <button class="key function" data-action="mc">MC</button>
                    <button class="key function" data-action="mr">MR</button>
                    <button class="key function" data-action="m+">M+</button>
                    <button class="key function" data-action="m-">M−</button>

                    <button class="key danger" data-action="clear">C</button>
                    <button class="key danger" data-action="ce">CE</button>
                    <button class="key" data-action="backspace">⌫</button>
                    <button class="key operator" data-op="÷">÷</button>

                    <button class="key number" data-num="7">۷</button>
                    <button class="key number" data-num="8">۸</button>
                    <button class="key number" data-num="9">۹</button>
                    <button class="key operator" data-op="×">×</button>

                    <button class="key number" data-num="4">۴</button>
                    <button class="key number" data-num="5">۵</button>
                    <button class="key number" data-num="6">۶</button>
                    <button class="key operator" data-op="−">−</button>

                    <button class="key number" data-num="1">۱</button>
                    <button class="key number" data-num="2">۲</button>
                    <button class="key number" data-num="3">۳</button>
                    <button class="key operator" data-op="+">+</button>

                    <button class="key number" data-action="sign">±</button>
                    <button class="key number" data-num="0">۰</button>
                    <button class="key number" data-num=".">.</button>
                    <button class="key equals" data-action="equals">=</button>
                `;
            } else {
                keypad.innerHTML = `
                    <button class="key function" data-fn="sin">sin</button>
                    <button class="key function" data-fn="cos">cos</button>
                    <button class="key function" data-fn="tan">tan</button>
                    <button class="key function" data-fn="log">log</button>
                    <button class="key function" data-fn="ln">ln</button>

                    <button class="key function" data-fn="asin">sin⁻¹</button>
                    <button class="key function" data-fn="acos">cos⁻¹</button>
                    <button class="key function" data-fn="atan">tan⁻¹</button>
                    <button class="key function" data-fn="sq">x²</button>
                    <button class="key function" data-fn="sqrt">√</button>

                    <button class="key function" data-fn="pow10">10ˣ</button>
                    <button class="key function" data-fn="exp">eˣ</button>
                    <button class="key function" data-fn="inv">1/x</button>
                    <button class="key function" data-fn="fact">n!</button>
                    <button class="key function" data-fn="abs">|x|</button>

                    <button class="key function" data-const="pi">π</button>
                    <button class="key function" data-const="e">e</button>
                    <button class="key danger" data-action="clear">C</button>
                    <button class="key" data-action="backspace">⌫</button>
                    <button class="key operator" data-op="÷">÷</button>

                    <button class="key number" data-num="7">۷</button>
                    <button class="key number" data-num="8">۸</button>
                    <button class="key number" data-num="9">۹</button>
                    <button class="key operator" data-op="×">×</button>
                    <button class="key operator" data-op="^">xʸ</button>

                    <button class="key number" data-num="4">۴</button>
                    <button class="key number" data-num="5">۵</button>
                    <button class="key number" data-num="6">۶</button>
                    <button class="key operator" data-op="−">−</button>
                    <button class="key function" data-fn="cbrt">∛</button>

                    <button class="key number" data-num="1">۱</button>
                    <button class="key number" data-num="2">۲</button>
                    <button class="key number" data-num="3">۳</button>
                    <button class="key operator" data-op="+">+</button>
                    <button class="key function" data-action="sign">±</button>

                    <button class="key number" data-num="0">۰</button>
                    <button class="key number" data-num=".">.</button>
                    <button class="key function" data-action="mc">MC</button>
                    <button class="key function" data-action="mr">MR</button>
                    <button class="key equals" data-action="equals">=</button>
                `;
            }

            // Bind events
            keypad.querySelectorAll('.key').forEach(btn => {
                btn.addEventListener('click', () => handleKey(btn));
            });
        }

        function handleKey(btn) {
            if (btn.dataset.num !== undefined) {
                appendNumber(btn.dataset.num);
            } else if (btn.dataset.op) {
                appendOperator(btn.dataset.op);
            } else if (btn.dataset.fn) {
                applyFunction(btn.dataset.fn);
            } else if (btn.dataset.const) {
                insertConstant(btn.dataset.const);
            } else if (btn.dataset.action) {
                switch (btn.dataset.action) {
                    case 'clear': clearAll(); break;
                    case 'ce': clearEntry(); break;
                    case 'backspace': backspace(); break;
                    case 'equals': calculate(); break;
                    case 'sign': toggleSign(); break;
                    case 'mc': memoryClear(); break;
                    case 'mr': memoryRecall(); break;
                    case 'm+': memoryAdd(); break;
                    case 'm-': memorySub(); break;
                }
            }
        }

        // ==================== Events ====================
        function initEvents() {
            // Mode switch
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    mode = tab.dataset.mode;
                    localStorage.setItem(STORAGE.mode, mode);
                    renderKeypad();
                });
            });

            // Theme
            document.getElementById('themeBtn').addEventListener('click', () => {
                const isLight = document.documentElement.getAttribute('data-theme') === 'light';
                if (isLight) {
                    document.documentElement.removeAttribute('data-theme');
                    document.getElementById('themeBtn').textContent = '☀️';
                    localStorage.setItem(STORAGE.theme, 'dark');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                    document.getElementById('themeBtn').textContent = '🌙';
                    localStorage.setItem(STORAGE.theme, 'light');
                }
            });

            // History panel
            document.getElementById('historyBtn').addEventListener('click', () => {
                const panel = document.getElementById('historyPanel');
                panel.classList.toggle('open');
                document.getElementById('historyBtn').classList.toggle('active', panel.classList.contains('open'));
                renderHistory();
            });

            document.getElementById('clearHistoryBtn').addEventListener('click', () => {
                history = [];
                saveHistory();
                renderHistory();
                showToast('تاریخچه پاک شد');
            });

            // Copy
            document.getElementById('copyBtn').addEventListener('click', () => {
                const text = currentInput === 'Error' ? '' : currentInput;
                if (text) {
                    navigator.clipboard.writeText(text).then(() => showToast('کپی شد 📋'));
                }
            });

            // Keyboard support
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;

                const key = e.key;

                if (/^[0-9.]$/.test(key)) {
                    e.preventDefault();
                    appendNumber(key);
                } else if (key === '+') {
                    e.preventDefault();
                    appendOperator('+');
                } else if (key === '-') {
                    e.preventDefault();
                    appendOperator('−');
                } else if (key === '*') {
                    e.preventDefault();
                    appendOperator('×');
                } else if (key === '/') {
                    e.preventDefault();
                    appendOperator('÷');
                } else if (key === 'Enter' || key === '=') {
                    e.preventDefault();
                    calculate();
                } else if (key === 'Backspace') {
                    e.preventDefault();
                    backspace();
                } else if (key === 'Escape') {
                    e.preventDefault();
                    clearAll();
                } else if (key === '%') {
                    e.preventDefault();
                    appendOperator('%');
                } else if (key === '^') {
                    e.preventDefault();
                    appendOperator('^');
                }
            });
        }

        // ==================== Init ====================
        function init() {
            loadData();
            renderKeypad();
            updateDisplay();
            renderHistory();
            initEvents();
        }

        init();
    </script>
</body>
</html>
