<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خرداد مرورگر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --bg: #ffffff;
            --bg-secondary: #f1f3f4;
            --bg-tab: #dee1e6;
            --bg-tab-active: #ffffff;
            --text: #202124;
            --text-secondary: #5f6368;
            --border: #dadce0;
            --shadow: 0 1px 3px rgba(0,0,0,0.12);
            --radius: 16px;
            --danger: #d93025;
            --success: #188038;
            --transition: all 0.2s ease;
        }
        [data-theme="dark"] {
            --primary: #8ab4f8;
            --primary-hover: #aecbfa;
            --bg: #202124;
            --bg-secondary: #303134;
            --bg-tab: #3c4043;
            --bg-tab-active: #202124;
            --text: #e8eaed;
            --text-secondary: #9aa0a6;
            --border: #5f6368;
            --shadow: 0 1px 3px rgba(0,0,0,0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .titlebar {
            background: var(--bg-tab);
            display: flex;
            align-items: flex-end;
            padding: 6px 6px 0;
            gap: 2px;
            min-height: 40px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .tabs-container {
            display: flex;
            flex: 1;
            overflow-x: auto;
            gap: 2px;
            align-items: flex-end;
            scrollbar-width: none;
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            background: transparent;
            border-radius: 10px 10px 0 0;
            min-width: 110px;
            max-width: 170px;
            cursor: pointer;
            font-size: 0.8rem;
            border: 1px solid transparent;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .tab.active {
            background: var(--bg-tab-active);
            border-color: var(--border);
            border-bottom-color: var(--bg-tab-active);
        }
        .tab-favicon { width: 14px; height: 14px; flex-shrink: 0; font-size: 0.7rem; }
        .tab-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tab-close {
            width: 18px; height: 18px; border: none; background: transparent;
            border-radius: 50%; color: var(--text-secondary); cursor: pointer;
            font-size: 0.8rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .tab-close:hover { background: rgba(0,0,0,0.1); }
        .new-tab-btn {
            width: 32px; height: 32px; border: none; background: transparent;
            border-radius: 50%; font-size: 1.3rem; color: var(--text-secondary);
            cursor: pointer; margin-bottom: 4px; flex-shrink: 0;
        }
        .new-tab-btn:hover { background: rgba(0,0,0,0.08); }
        .toolbar {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 6px 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .nav-btns { display: flex; gap: 1px; flex-shrink: 0; }
        .nav-btn {
            width: 34px; height: 34px; border: none; background: transparent;
            border-radius: 50%; font-size: 1.05rem; color: var(--text-secondary);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .nav-btn:hover:not(:disabled) { background: var(--bg-secondary); color: var(--text); }
        .nav-btn:disabled { opacity: 0.35; cursor: default; }
        .address-bar {
            flex: 1; display: flex; align-items: center;
            background: var(--bg-secondary); border-radius: 20px;
            padding: 0 10px; height: 36px; border: 1px solid transparent; min-width: 0;
        }
        .address-bar:focus-within {
            background: var(--bg); border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(26,115,232,0.15);
        }
        .secure-icon { font-size: 0.85rem; margin-left: 4px; flex-shrink: 0; }
        .address-bar input {
            flex: 1; border: none; background: transparent; outline: none;
            font-family: inherit; font-size: 0.9rem; color: var(--text);
            direction: ltr; text-align: left; min-width: 0; padding: 0 6px;
        }
        .address-actions { display: flex; gap: 2px; flex-shrink: 0; }
        .address-actions button {
            width: 28px; height: 28px; border: none; background: transparent;
            border-radius: 50%; font-size: 0.95rem; color: var(--text-secondary); cursor: pointer;
        }
        .toolbar-right { display: flex; gap: 1px; flex-shrink: 0; }
        .bookmarks-bar {
            background: var(--bg); border-bottom: 1px solid var(--border);
            padding: 3px 8px; display: flex; align-items: center; gap: 4px;
            overflow-x: auto; flex-shrink: 0; min-height: 32px; scrollbar-width: none;
        }
        .bookmarks-bar::-webkit-scrollbar { display: none; }
        .bookmark-item {
            display: flex; align-items: center; gap: 4px; padding: 3px 8px;
            border-radius: 12px; border: none; background: transparent;
            font-family: inherit; font-size: 0.75rem; color: var(--text);
            cursor: pointer; white-space: nowrap;
        }
        .bookmark-item:hover { background: var(--bg-secondary); }
        .content { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
        .page-view {
            position: absolute; inset: 0; display: none; flex-direction: column; overflow: hidden;
        }
        .page-view.active { display: flex; }
        iframe.page-frame { width: 100%; height: 100%; border: none; background: #fff; }
        .home-page {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 20px 16px; overflow-y: auto;
        }
        .logo {
            font-size: 3.6rem; font-weight: 800; margin-bottom: 24px;
            background: linear-gradient(135deg, #4285f4, #34a853, #fbbc05, #ea4335);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; user-select: none;
        }
        .home-search {
            width: 100%; max-width: 520px; display: flex; align-items: center;
            background: var(--bg); border: 1px solid var(--border); border-radius: 24px;
            padding: 4px 14px; box-shadow: var(--shadow); margin-bottom: 28px;
        }
        .home-search:focus-within { box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
        .home-search input {
            flex: 1; border: none; outline: none; background: transparent;
            font-family: inherit; font-size: 1rem; padding: 12px 8px; color: var(--text);
        }
        .home-search button {
            background: none; border: none; font-size: 1.3rem; color: var(--primary);
            cursor: pointer; padding: 6px;
        }
        .quick-links {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
            max-width: 400px; width: 100%;
        }
        .quick-link {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            padding: 10px 6px; border-radius: 12px; border: none; background: transparent;
            font-family: inherit; color: var(--text); cursor: pointer; font-size: 0.75rem;
        }
        .quick-link:hover { background: var(--bg-secondary); }
        .quick-link-icon {
            width: 44px; height: 44px; border-radius: 50%; background: var(--bg-secondary);
            display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
        }
        .search-results { flex: 1; overflow-y: auto; padding: 16px; }
        .search-header { margin-bottom: 18px; }
        .search-header h2 { font-size: 1.1rem; margin-bottom: 4px; }
        .search-header p { font-size: 0.85rem; color: var(--text-secondary); }
        .result-card {
            background: var(--bg-secondary); border-radius: 12px; padding: 14px 16px;
            margin-bottom: 10px; cursor: pointer; transition: var(--transition);
            border: 1px solid transparent;
        }
        .result-card:hover { border-color: var(--primary); }
        .result-title { font-weight: 600; font-size: 1rem; color: var(--primary); margin-bottom: 4px; }
        .result-url {
            font-size: 0.75rem; color: var(--success); direction: ltr; text-align: right;
            margin-bottom: 6px; word-break: break-all;
        }
        .result-snippet { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; }
        .abstract-box {
            background: linear-gradient(135deg, rgba(26,115,232,0.08), rgba(52,168,83,0.08));
            border: 1px solid rgba(26,115,232,0.2); border-radius: 12px;
            padding: 16px; margin-bottom: 18px;
        }
        .abstract-box h3 { font-size: 1rem; margin-bottom: 8px; color: var(--primary); }
        .external-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
        .ext-btn {
            padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border);
            background: var(--bg); font-family: inherit; font-size: 0.8rem;
            cursor: pointer; color: var(--text);
        }
        .ext-btn:hover { background: var(--bg-secondary); }
        .error-view {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 30px 20px; text-align: center;
        }
        .error-view .icon { font-size: 3.5rem; margin-bottom: 12px; opacity: 0.5; }
        .error-view h2 { font-size: 1.2rem; margin-bottom: 8px; }
        .error-view p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 16px; max-width: 320px; line-height: 1.6; }
        .side-panel {
            position: absolute; top: 0; left: 0; width: min(320px, 100%); height: 100%;
            background: var(--bg); border-left: 1px solid var(--border);
            box-shadow: -4px 0 20px rgba(0,0,0,0.12); z-index: 100;
            transform: translateX(-105%); transition: transform 0.25s ease;
            display: flex; flex-direction: column;
        }
        .side-panel.open { transform: translateX(0); }
        .side-panel-header {
            padding: 14px 16px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .side-panel-header h3 { font-size: 1.05rem; }
        .side-panel-content { flex: 1; overflow-y: auto; padding: 10px; }
        .panel-item {
            display: flex; align-items: center; gap: 10px; padding: 10px;
            border-radius: 10px; cursor: pointer; margin-bottom: 2px;
        }
        .panel-item:hover { background: var(--bg-secondary); }
        .panel-item-icon {
            width: 34px; height: 34px; border-radius: 50%; background: var(--bg-secondary);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .panel-item-info { flex: 1; min-width: 0; }
        .panel-item-title {
            font-size: 0.9rem; font-weight: 500; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .panel-item-url {
            font-size: 0.72rem; color: var(--text-secondary); white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; direction: ltr; text-align: right;
        }
        .empty-panel { text-align: center; padding: 40px 16px; color: var(--text-secondary); font-size: 0.9rem; }
        .setting-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 10px; border-bottom: 1px solid var(--border);
        }
        .toggle {
            width: 42px; height: 24px; background: var(--border); border-radius: 12px;
            position: relative; cursor: pointer; transition: var(--transition);
        }
        .toggle.active { background: var(--primary); }
        .toggle::after {
            content: ''; position: absolute; width: 18px; height: 18px; background: #fff;
            border-radius: 50%; top: 3px; right: 3px; transition: var(--transition);
        }
        .toggle.active::after { right: 21px; }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center; z-index: 200;
            opacity: 0; visibility: hidden; transition: var(--transition); padding: 16px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal {
            background: var(--bg); border-radius: 16px; width: 100%; max-width: 360px;
            overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        .modal-header { padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 700; }
        .modal-body { padding: 16px 18px; }
        .modal-body label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 4px; }
        .modal-body input {
            width: 100%; padding: 10px 12px; border: 1px solid var(--border);
            border-radius: 8px; background: var(--bg-secondary); color: var(--text);
            font-family: inherit; font-size: 0.9rem; outline: none; margin-bottom: 12px;
        }
        .modal-footer {
            padding: 12px 18px; border-top: 1px solid var(--border);
            display: flex; justify-content: flex-end; gap: 8px;
        }
        .btn {
            padding: 8px 16px; border-radius: 20px; border: none;
            font-family: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: var(--bg); color: var(--text); padding: 10px 18px;
            border-radius: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            font-size: 0.85rem; border: 1px solid var(--border); z-index: 300;
            animation: toastIn 0.25s ease;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .loading-spinner {
            width: 36px; height: 36px; border: 3px solid var(--border);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.7s linear infinite; margin: 40px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 500px) {
            .tab { min-width: 95px; max-width: 130px; padding: 7px 8px; }
            .logo { font-size: 2.8rem; }
            .quick-links { grid-template-columns: repeat(4, 1fr); gap: 8px; }
            .nav-btn { width: 32px; height: 32px; }
            .toolbar { padding: 5px 6px; gap: 2px; }
        }
    </style>
</head>
<body>
    <div class="titlebar">
        <div class="tabs-container" id="tabsContainer"></div>
        <button class="new-tab-btn" id="newTabBtn" title="تب جدید">+</button>
    </div>

    <div class="toolbar">
        <div class="nav-btns">
            <button class="nav-btn" id="backBtn" disabled title="قبلی">←</button>
            <button class="nav-btn" id="forwardBtn" disabled title="بعدی">→</button>
            <button class="nav-btn" id="reloadBtn" title="بارگذاری مجدد">↻</button>
            <button class="nav-btn" id="homeBtn" title="خانه">🏠</button>
        </div>
        <div class="address-bar">
            <span class="secure-icon" id="secureIcon">🔍</span>
            <input type="text" id="urlInput" placeholder="جستجو یا وارد کردن آدرس..." spellcheck="false" autocomplete="off">
            <div class="address-actions">
                <button id="clearUrlBtn" style="display:none;">✕</button>
                <button id="goBtn">🔍</button>
            </div>
        </div>
        <div class="toolbar-right">
            <button class="nav-btn" id="bookmarkBtn" title="نشانک">⭐</button>
            <button class="nav-btn" id="bookmarksPanelBtn" title="نشانک‌ها">📑</button>
            <button class="nav-btn" id="historyPanelBtn" title="تاریخچه">🕒</button>
            <button class="nav-btn" id="menuBtn" title="منو">⋮</button>
        </div>
    </div>

    <div class="bookmarks-bar" id="bookmarksBar"></div>
    <div class="content" id="content"></div>

    <div class="side-panel" id="sidePanel">
        <div class="side-panel-header">
            <h3 id="panelTitle">نشانک‌ها</h3>
            <button class="nav-btn" id="closePanelBtn">✕</button>
        </div>
        <div class="side-panel-content" id="panelContent"></div>
    </div>

    <div class="modal-overlay" id="bookmarkModal">
        <div class="modal">
            <div class="modal-header">افزودن نشانک</div>
            <div class="modal-body">
                <label>نام</label>
                <input type="text" id="bmNameInput" placeholder="نام نشانک">
                <label>آدرس</label>
                <input type="text" id="bmUrlInput" placeholder="https://..." dir="ltr">
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="cancelBmBtn">انصراف</button>
                <button class="btn btn-primary" id="saveBmBtn">ذخیره</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE = {
            bookmarks: 'khordad_br_bookmarks',
            history: 'khordad_br_history',
            settings: 'khordad_br_settings',
            theme: 'khordad_br_theme'
        };

        let tabs = [];
        let activeTabId = null;
        let bookmarks = [];
        let historyList = [];
        let settings = { darkMode: false, showBookmarksBar: true };

        const DEFAULT_LINKS = [
            { title: 'گوگل', url: 'https://www.google.com', icon: '🔍' },
            { title: 'یوتیوب', url: 'https://www.youtube.com', icon: '▶️' },
            { title: 'ویکی‌پدیا', url: 'https://fa.wikipedia.org', icon: '📖' },
            { title: 'گیت‌هاب', url: 'https://github.com', icon: '🐙' },
            { title: 'توییتر', url: 'https://x.com', icon: '🐦' },
            { title: 'ردیت', url: 'https://www.reddit.com', icon: '🤖' },
            { title: 'نقشه', url: 'https://www.openstreetmap.org', icon: '🗺️' },
            { title: 'ایمیل', url: 'https://mail.google.com', icon: '📧' }
        ];

        function uid() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        }

        function toast(msg) {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s || '';
            return d.innerHTML;
        }

        function isUrl(str) {
            str = str.trim();
            if (/^https?:\/\//i.test(str)) return true;
            if (/^[a-z0-9-]+(\.[a-z0-9-]+)+/i.test(str) && !/\s/.test(str)) return true;
            return false;
        }

        function normalizeUrl(input) {
            input = input.trim();
            if (!input) return null;
            if (isUrl(input)) return input.startsWith('http') ? input : 'https://' + input;
            return null;
        }

        function extractHost(url) {
            try { return new URL(url).hostname.replace(/^www\./, ''); }
            catch { return 'صفحه'; }
        }

        function loadData() {
            try {
                bookmarks = JSON.parse(localStorage.getItem(STORAGE.bookmarks) || '[]');
                historyList = JSON.parse(localStorage.getItem(STORAGE.history) || '[]');
                const s = localStorage.getItem(STORAGE.settings);
                if (s) settings = { ...settings, ...JSON.parse(s) };
                if (localStorage.getItem(STORAGE.theme) === 'dark') {
                    settings.darkMode = true;
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        }

        function saveBookmarks() { localStorage.setItem(STORAGE.bookmarks, JSON.stringify(bookmarks)); }
        function saveHistory() { localStorage.setItem(STORAGE.history, JSON.stringify(historyList.slice(0, 80))); }
        function saveSettings() { localStorage.setItem(STORAGE.settings, JSON.stringify(settings)); }

        function createTab(url) {
            const id = uid();
            const tab = {
                id, url: url || null,
                title: url ? extractHost(url) : 'تب جدید',
                history: url ? [url] : [],
                historyIndex: url ? 0 : -1,
                type: url ? 'url' : 'home'
            };
            tabs.push(tab);
            renderTabs();
            switchTab(id);
            if (url) loadUrl(id, url);
            else showHome(id);
            return id;
        }

        function switchTab(id) {
            activeTabId = id;
            renderTabs();
            document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
            const view = document.getElementById('view-' + id);
            if (view) view.classList.add('active');
            const tab = tabs.find(t => t.id === id);
            if (tab) {
                document.getElementById('urlInput').value = tab.url || (tab.searchQuery || '');
                updateSecureIcon(tab.url);
                updateNavButtons(tab);
            }
        }

        function closeTab(id, e) {
            if (e) e.stopPropagation();
            const idx = tabs.findIndex(t => t.id === id);
            if (idx === -1) return;
            const view = document.getElementById('view-' + id);
            if (view) view.remove();
            tabs.splice(idx, 1);
            if (tabs.length === 0) { createTab(); return; }
            if (activeTabId === id) switchTab(tabs[Math.max(0, idx - 1)].id);
            else renderTabs();
        }

        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            container.innerHTML = tabs.map(t => `
                <div class="tab ${t.id === activeTabId ? 'active' : ''}" data-id="${t.id}">
                    <span class="tab-favicon">${t.type === 'home' ? '🏠' : t.type === 'search' ? '🔍' : '🌐'}</span>
                    <span class="tab-title">${escapeHtml(t.title)}</span>
                    <button class="tab-close" data-close="${t.id}">✕</button>
                </div>
            `).join('');
            container.querySelectorAll('.tab').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.classList.contains('tab-close')) return;
                    switchTab(el.dataset.id);
                });
            });
            container.querySelectorAll('.tab-close').forEach(btn => {
                btn.addEventListener('click', (e) => closeTab(btn.dataset.close, e));
            });
        }

        function getOrCreateView(tabId) {
            let view = document.getElementById('view-' + tabId);
            if (!view) {
                view = document.createElement('div');
                view.id = 'view-' + tabId;
                view.className = 'page-view';
                document.getElementById('content').appendChild(view);
            }
            return view;
        }

        function showHome(tabId) {
            const tab = tabs.find(t => t.id === tabId);
            if (!tab) return;
            tab.type = 'home';
            tab.url = null;
            tab.searchQuery = null;
            tab.title = 'تب جدید';
            const view = getOrCreateView(tabId);
            view.innerHTML = `
                <div class="home-page">
                    <div class="logo">خرداد</div>
                    <div class="home-search">
                        <button id="homeSearchBtn-${tabId}">🔍</button>
                        <input type="text" id="homeSearch-${tabId}" placeholder="جستجو در وب یا وارد کردن آدرس...">
                    </div>
                    <div class="quick-links" id="quick-${tabId}"></div>
                </div>
            `;
            const input = document.getElementById('homeSearch-' + tabId);
            input.addEventListener('keydown', e => { if (e.key === 'Enter') navigate(input.value); });
            document.getElementById('homeSearchBtn-' + tabId).addEventListener('click', () => navigate(input.value));

            const links = bookmarks.length ? bookmarks.slice(0, 8).map(b => ({ title: b.title, url: b.url, icon: '⭐' })) : DEFAULT_LINKS;
            document.getElementById('quick-' + tabId).innerHTML = links.map(l => `
                <button class="quick-link" data-url="${escapeHtml(l.url)}">
                    <div class="quick-link-icon">${l.icon || '🌐'}</div>
                    <span>${escapeHtml(l.title)}</span>
                </button>
            `).join('');
            document.getElementById('quick-' + tabId).querySelectorAll('.quick-link').forEach(btn => {
                btn.addEventListener('click', () => navigate(btn.dataset.url));
            });

            if (tabId === activeTabId) {
                document.getElementById('urlInput').value = '';
                updateSecureIcon(null);
                renderTabs();
                updateNavButtons(tab);
            }
        }

        async function showSearchResults(tabId, query) {
            const tab = tabs.find(t => t.id === tabId);
            if (!tab) return;
            tab.type = 'search';
            tab.url = null;
            tab.searchQuery = query;
            tab.title = query.length > 18 ? query.slice(0, 18) + '…' : query;

            const view = getOrCreateView(tabId);
            view.innerHTML = `
                <div class="search-results">
                    <div class="search-header">
                        <h2>نتایج جستجو برای «${escapeHtml(query)}»</h2>
                        <p>در حال دریافت نتایج...</p>
                    </div>
                    <div class="loading-spinner"></div>
                </div>
            `;

            if (tabId === activeTabId) {
                document.getElementById('urlInput').value = query;
                updateSecureIcon(null);
                renderTabs();
                updateNavButtons(tab);
            }

            addToHistory('search:' + query, 'جستجو: ' + query);

            try {
                const apiUrl = 'https://api.duckduckgo.com/?q=' + encodeURIComponent(query) + '&format=json&pretty=1&no_redirect=1&no_html=1&skip_disambig=1';
                const res = await fetch(apiUrl);
                const data = await res.json();

                let html = `
                    <div class="search-results">
                        <div class="search-header">
                            <h2>نتایج برای «${escapeHtml(query)}»</h2>
                            <p>منبع: DuckDuckGo Instant Answer</p>
                        </div>
                `;

                if (data.AbstractText) {
                    html += `
                        <div class="abstract-box">
                            <h3>${escapeHtml(data.Heading || 'خلاصه')}</h3>
                            <p style="font-size:0.9rem;line-height:1.6;margin-bottom:8px;">${escapeHtml(data.AbstractText)}</p>
                            ${data.AbstractURL ? '<span class="result-url" style="color:var(--primary);cursor:pointer;" data-open="' + escapeHtml(data.AbstractURL) + '">' + escapeHtml(data.AbstractSource || data.AbstractURL) + '</span>' : ''}
                        </div>
                    `;
                }

                const topics = (data.RelatedTopics || []).filter(t => t.Text || (t.Topics && t.Topics.length));
                let count = 0;
                topics.forEach(t => {
                    if (count >= 12) return;
                    if (t.Text && t.FirstURL) {
                        html += `
                            <div class="result-card" data-open="${escapeHtml(t.FirstURL)}">
                                <div class="result-title">${escapeHtml((t.Text.split(' - ')[0] || t.Text).slice(0, 80))}</div>
                                <div class="result-url">${escapeHtml(t.FirstURL)}</div>
                                <div class="result-snippet">${escapeHtml(t.Text)}</div>
                            </div>`;
                        count++;
                    } else if (t.Topics) {
                        t.Topics.forEach(sub => {
                            if (count >= 12 || !sub.FirstURL) return;
                            html += `
                                <div class="result-card" data-open="${escapeHtml(sub.FirstURL)}">
                                    <div class="result-title">${escapeHtml(((sub.Text || '').split(' - ')[0] || '').slice(0, 80))}</div>
                                    <div class="result-url">${escapeHtml(sub.FirstURL)}</div>
                                    <div class="result-snippet">${escapeHtml(sub.Text || '')}</div>
                                </div>`;
                            count++;
                        });
                    }
                });

                if (count === 0 && !data.AbstractText) {
                    html += '<p style="text-align:center;color:var(--text-secondary);padding:30px;">نتیجه مستقیمی یافت نشد.</p>';
                }

                html += `
                    <div class="external-btns">
                        <button class="ext-btn" data-ext="https://www.google.com/search?q=${encodeURIComponent(query)}">🔍 گوگل</button>
                        <button class="ext-btn" data-ext="https://duckduckgo.com/?q=${encodeURIComponent(query)}">🦆 داک‌داک‌گو</button>
                        <button class="ext-btn" data-ext="https://www.bing.com/search?q=${encodeURIComponent(query)}">🅱️ بینگ</button>
                        <button class="ext-btn" data-ext="https://search.yahoo.com/search?p=${encodeURIComponent(query)}">🔴 یاهو</button>
                    </div>
                    <p style="text-align:center;font-size:0.75rem;color:var(--text-secondary);margin-top:16px;padding-bottom:20px;">
                        برای دیدن نتایج کامل‌تر وب روی یکی از دکمه‌های بالا بزنید
                    </p>
                </div>`;

                view.innerHTML = html;

                view.querySelectorAll('[data-open]').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.preventDefault();
                        const u = el.getAttribute('data-open');
                        if (u) loadUrl(tabId, u);
                    });
                });
                view.querySelectorAll('[data-ext]').forEach(el => {
                    el.addEventListener('click', () => window.open(el.getAttribute('data-ext'), '_blank'));
                });

            } catch (err) {
                console.error(err);
                view.innerHTML = `
                    <div class="search-results">
                        <div class="search-header"><h2>نتایج برای «${escapeHtml(query)}»</h2></div>
                        <p style="text-align:center;color:var(--text-secondary);padding:20px;">
                            دریافت نتایج با خطا مواجه شد. می‌توانید مستقیماً جستجو کنید:
                        </p>
                        <div class="external-btns" style="justify-content:center;">
                            <button class="ext-btn" data-ext="https://www.google.com/search?q=${encodeURIComponent(query)}">🔍 گوگل</button>
                            <button class="ext-btn" data-ext="https://duckduckgo.com/?q=${encodeURIComponent(query)}">🦆 داک‌داک‌گو</button>
                            <button class="ext-btn" data-ext="https://www.bing.com/search?q=${encodeURIComponent(query)}">🅱️ بینگ</button>
                        </div>
                    </div>
                `;
                view.querySelectorAll('[data-ext]').forEach(el => {
                    el.addEventListener('click', () => window.open(el.getAttribute('data-ext'), '_blank'));
                });
            }
        }

        function loadUrl(tabId, url, addHistory) {
            if (addHistory === undefined) addHistory = true;
            const tab = tabs.find(t => t.id === tabId);
            if (!tab) return;

            tab.type = 'url';
            tab.url = url;
            tab.searchQuery = null;
            tab.title = extractHost(url);

            if (addHistory) {
                tab.history = tab.history.slice(0, tab.historyIndex + 1);
                tab.history.push(url);
                tab.historyIndex = tab.history.length - 1;
            }

            const view = getOrCreateView(tabId);
            view.innerHTML = '<iframe class="page-frame" id="frame-' + tabId + '" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>';

            const frame = document.getElementById('frame-' + tabId);
            let loaded = false;
            const timer = setTimeout(() => {
                if (!loaded) showError(tabId, url);
            }, 7000);

            frame.onload = () => {
                loaded = true;
                clearTimeout(timer);
                try {
                    const title = frame.contentDocument && frame.contentDocument.title;
                    if (title) {
                        tab.title = title.slice(0, 40);
                        renderTabs();
                    }
                } catch (e) {}
            };
            frame.onerror = () => {
                loaded = true;
                clearTimeout(timer);
                showError(tabId, url);
            };

            try { frame.src = url; }
            catch (e) { showError(tabId, url); }

            addToHistory(url, tab.title);

            if (tabId === activeTabId) {
                document.getElementById('urlInput').value = url;
                updateSecureIcon(url);
                updateNavButtons(tab);
                renderTabs();
            }
        }

        function showError(tabId, url) {
            const tab = tabs.find(t => t.id === tabId);
            if (tab) {
                tab.type = 'error';
                tab.title = extractHost(url);
            }
            const view = getOrCreateView(tabId);
            view.innerHTML = `
                <div class="error-view">
                    <div class="icon">🚫</div>
                    <h2>این سایت در مرورگر داخلی قابل نمایش نیست</h2>
                    <p>بسیاری از سایت‌ها (گوگل، اینستاگرام، یوتیوب و ...) به دلایل امنیتی اجازه نمایش داخل iframe را نمی‌دهند.</p>
                    <p style="direction:ltr;font-size:0.8rem;opacity:0.7;word-break:break-all;">${escapeHtml(url)}</p>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px;">
                        <button class="btn btn-primary" id="openExt-${tabId}">باز کردن در مرورگر سیستم</button>
                        <button class="btn btn-outline" id="newTabErr-${tabId}">تب جدید</button>
                    </div>
                </div>
            `;
            document.getElementById('openExt-' + tabId).addEventListener('click', () => window.open(url, '_blank'));
            document.getElementById('newTabErr-' + tabId).addEventListener('click', () => createTab());
            if (tabId === activeTabId) renderTabs();
        }

        function navigate(input) {
            if (!input || !input.trim()) return;
            input = input.trim();
            const url = normalizeUrl(input);
            if (url) loadUrl(activeTabId, url);
            else showSearchResults(activeTabId, input);
        }

        function goBack() {
            const tab = tabs.find(t => t.id === activeTabId);
            if (!tab || tab.historyIndex <= 0) return;
            tab.historyIndex--;
            loadUrl(activeTabId, tab.history[tab.historyIndex], false);
        }

        function goForward() {
            const tab = tabs.find(t => t.id === activeTabId);
            if (!tab || tab.historyIndex >= tab.history.length - 1) return;
            tab.historyIndex++;
            loadUrl(activeTabId, tab.history[tab.historyIndex], false);
        }

        function reload() {
            const tab = tabs.find(t => t.id === activeTabId);
            if (!tab) return;
            if (tab.type === 'url' && tab.url) loadUrl(activeTabId, tab.url, false);
            else if (tab.type === 'search' && tab.searchQuery) showSearchResults(activeTabId, tab.searchQuery);
            else showHome(activeTabId);
        }

        function goHome() {
            showHome(activeTabId);
        }

        function updateNavButtons(tab) {
            if (!tab) return;
            document.getElementById('backBtn').disabled = tab.historyIndex <= 0;
            document.getElementById('forwardBtn').disabled = tab.historyIndex >= tab.history.length - 1 || tab.history.length === 0;
        }

        function updateSecureIcon(url) {
            const icon = document.getElementById('secureIcon');
            if (!url) {
                icon.textContent = '🔍';
                icon.style.color = 'var(--text-secondary)';
            } else if (url.startsWith('https')) {
                icon.textContent = '🔒';
                icon.style.color = 'var(--success)';
            } else {
                icon.textContent = '⚠️';
                icon.style.color = 'orange';
            }
        }

        function addBookmark(title, url) {
            if (!url) return;
            if (bookmarks.some(b => b.url === url)) { toast('قبلاً ذخیره شده'); return; }
            bookmarks.unshift({ id: uid(), title: title || extractHost(url), url, addedAt: Date.now() });
            saveBookmarks();
            renderBookmarksBar();
            toast('به نشانک‌ها اضافه شد ⭐');
        }

        function removeBookmark(id) {
            bookmarks = bookmarks.filter(b => b.id !== id);
            saveBookmarks();
            renderBookmarksBar();
            if (document.getElementById('sidePanel').classList.contains('open')) renderBookmarksPanel();
            toast('حذف شد');
        }

        function renderBookmarksBar() {
            const bar = document.getElementById('bookmarksBar');
            if (!settings.showBookmarksBar) { bar.style.display = 'none'; return; }
            bar.style.display = 'flex';
            if (!bookmarks.length) {
                bar.innerHTML = '<span style="font-size:0.75rem;color:var(--text-secondary);padding:2px 8px;">نشانکی ندارید</span>';
                return;
            }
            bar.innerHTML = bookmarks.slice(0, 10).map(b => `
                <button class="bookmark-item" data-url="${escapeHtml(b.url)}">
                    <span>⭐</span> ${escapeHtml(b.title)}
                </button>
            `).join('');
            bar.querySelectorAll('.bookmark-item').forEach(btn => {
                btn.addEventListener('click', () => navigate(btn.dataset.url));
            });
        }

        function addToHistory(url, title) {
            historyList = historyList.filter(h => h.url !== url);
            historyList.unshift({ id: uid(), url, title: title || extractHost(url), time: Date.now() });
            historyList = historyList.slice(0, 80);
            saveHistory();
        }

        function renderBookmarksPanel() {
            document.getElementById('panelTitle').textContent = 'نشانک‌ها';
            const content = document.getElementById('panelContent');
            if (!bookmarks.length) {
                content.innerHTML = '<div class="empty-panel">هنوز نشانکی ذخیره نکرده‌اید</div>';
                return;
            }
            content.innerHTML = bookmarks.map(b => `
                <div class="panel-item" data-url="${escapeHtml(b.url)}">
                    <div class="panel-item-icon">⭐</div>
                    <div class="panel-item-info">
                        <div class="panel-item-title">${escapeHtml(b.title)}</div>
                        <div class="panel-item-url">${escapeHtml(b.url)}</div>
                    </div>
                    <button onclick="event.stopPropagation();removeBookmark('${b.id}')" style="background:none;border:none;cursor:pointer;font-size:1rem;">🗑️</button>
                </div>
            `).join('');
            content.querySelectorAll('.panel-item').forEach(el => {
                el.addEventListener('click', () => { navigate(el.dataset.url); closeSidePanel(); });
            });
        }

        function renderHistoryPanel() {
            document.getElementById('panelTitle').textContent = 'تاریخچه';
            const content = document.getElementById('panelContent');
            if (!historyList.length) {
                content.innerHTML = '<div class="empty-panel">تاریخچه‌ای وجود ندارد</div>';
                return;
            }
            content.innerHTML = historyList.map(h => `
                <div class="panel-item" data-url="${escapeHtml(h.url)}">
                    <div class="panel-item-icon">🕒</div>
                    <div class="panel-item-info">
                        <div class="panel-item-title">${escapeHtml(h.title)}</div>
                        <div class="panel-item-url">${escapeHtml(h.url.startsWith('search:') ? h.title : h.url)}</div>
                    </div>
                </div>
            `).join('');
            content.querySelectorAll('.panel-item').forEach(el => {
                el.addEventListener('click', () => {
                    const url = el.dataset.url;
                    if (url.startsWith('search:')) showSearchResults(activeTabId, url.replace('search:', ''));
                    else navigate(url);
                    closeSidePanel();
                });
            });
        }

        function renderSettingsPanel() {
            document.getElementById('panelTitle').textContent = 'تنظیمات';
            const content = document.getElementById('panelContent');
            content.innerHTML = `
                <div class="setting-row">
                    <span>حالت شب</span>
                    <div class="toggle ${settings.darkMode ? 'active' : ''}" id="themeToggle"></div>
                </div>
                <div class="setting-row">
                    <span>نوار نشانک‌ها</span>
                    <div class="toggle ${settings.showBookmarksBar ? 'active' : ''}" id="bmBarToggle"></div>
                </div>
                <div style="padding:16px 10px;">
                    <button class="btn btn-outline" style="width:100%;color:var(--danger);border-color:var(--danger);" id="clearDataBtn">🗑️ پاک کردن همه داده‌ها</button>
                </div>
                <p style="text-align:center;font-size:0.75rem;color:var(--text-secondary);padding:8px;">
                    خرداد مرورگر • داده‌ها فقط روی دستگاه شما ذخیره می‌شوند
                </p>
            `;
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            document.getElementById('bmBarToggle').addEventListener('click', function () {
                this.classList.toggle('active');
                settings.showBookmarksBar = this.classList.contains('active');
                saveSettings();
                renderBookmarksBar();
            });
            document.getElementById('clearDataBtn').addEventListener('click', () => {
                if (confirm('همه نشانک‌ها و تاریخچه پاک شود؟')) {
                    bookmarks = []; historyList = [];
                    saveBookmarks(); saveHistory();
                    renderBookmarksBar();
                    toast('پاک شد');
                }
            });
        }

        function openSidePanel(type) {
            document.getElementById('sidePanel').classList.add('open');
            if (type === 'bookmarks') renderBookmarksPanel();
            else if (type === 'history') renderHistoryPanel();
            else renderSettingsPanel();
        }

        function closeSidePanel() {
            document.getElementById('sidePanel').classList.remove('open');
        }

        function toggleTheme() {
            settings.darkMode = !settings.darkMode;
            if (settings.darkMode) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem(STORAGE.theme, 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem(STORAGE.theme, 'light');
            }
            saveSettings();
            const t = document.getElementById('themeToggle');
            if (t) t.classList.toggle('active', settings.darkMode);
        }

        function initEvents() {
            document.getElementById('newTabBtn').addEventListener('click', () => createTab());
            document.getElementById('backBtn').addEventListener('click', goBack);
            document.getElementById('forwardBtn').addEventListener('click', goForward);
            document.getElementById('reloadBtn').addEventListener('click', reload);
            document.getElementById('homeBtn').addEventListener('click', goHome);

            const urlInput = document.getElementById('urlInput');
            urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') navigate(urlInput.value); });
            urlInput.addEventListener('input', () => {
                document.getElementById('clearUrlBtn').style.display = urlInput.value ? 'block' : 'none';
            });
            document.getElementById('clearUrlBtn').addEventListener('click', () => {
                urlInput.value = '';
                document.getElementById('clearUrlBtn').style.display = 'none';
                urlInput.focus();
            });
            document.getElementById('goBtn').addEventListener('click', () => navigate(urlInput.value));

            document.getElementById('bookmarkBtn').addEventListener('click', () => {
                const tab = tabs.find(t => t.id === activeTabId);
                if (tab && tab.url) {
                    document.getElementById('bmNameInput').value = tab.title;
                    document.getElementById('bmUrlInput').value = tab.url;
                    document.getElementById('bookmarkModal').classList.add('active');
                } else toast('ابتدا یک صفحه باز کنید');
            });

            document.getElementById('saveBmBtn').addEventListener('click', () => {
                const name = document.getElementById('bmNameInput').value.trim();
                let url = document.getElementById('bmUrlInput').value.trim();
                if (url) {
                    if (!url.startsWith('http')) url = 'https://' + url;
                    addBookmark(name || extractHost(url), url);
                    document.getElementById('bookmarkModal').classList.remove('active');
                }
            });
            document.getElementById('cancelBmBtn').addEventListener('click', () => {
                document.getElementById('bookmarkModal').classList.remove('active');
            });

            document.getElementById('bookmarksPanelBtn').addEventListener('click', () => openSidePanel('bookmarks'));
            document.getElementById('historyPanelBtn').addEventListener('click', () => openSidePanel('history'));
            document.getElementById('menuBtn').addEventListener('click', () => openSidePanel('settings'));
            document.getElementById('closePanelBtn').addEventListener('click', closeSidePanel);

            document.getElementById('bookmarkModal').addEventListener('click', e => {
                if (e.target.id === 'bookmarkModal') document.getElementById('bookmarkModal').classList.remove('active');
            });

            document.addEventListener('keydown', e => {
                if (e.ctrlKey || e.metaKey) {
                    if (e.key === 't') { e.preventDefault(); createTab(); }
                    else if (e.key === 'w') { e.preventDefault(); if (activeTabId) closeTab(activeTabId); }
                    else if (e.key === 'l') { e.preventDefault(); urlInput.focus(); urlInput.select(); }
                    else if (e.key === 'd') { e.preventDefault(); document.getElementById('bookmarkBtn').click(); }
                    else if (e.key === 'h') { e.preventDefault(); openSidePanel('history'); }
                }
            });
        }

        function init() {
            loadData();
            initEvents();
            renderBookmarksBar();
            createTab();
        }

        init();
    </script>
</body>
</html>
