<div class="loader">

<style>
.loader {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.loader-inner {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background-color: #fff;
  animation: loader-animation 1s infinite ease-in-out;
}

@keyframes loader-animation {
  0% {
    transform: scale(0);
    opacity: 0.5;
  }
  
  50% {
    transform: scale(1);
    opacity: 1;
  }
  
  100% {
    transform: scale(0);
    opacity: 0.5;
  }
}

/* Hide loader after 5 seconds */
.loader {
  animation: hide-loader 5s forwards;
}

@keyframes hide-loader {
  to {
    opacity: 0;
    visibility: hidden;
  }
}
</style>

  <script>
setInterval(changeBackground, 5000);
    
    function changeBackground() {
      var body = document.querySelector('body');
      var randomColor1 = getRandomColor();
      var randomColor2 = getRandomColor();
      var gradient = 'linear-gradient(45deg, ' + randomColor1 + ', ' + randomColor2 + ')';
      body.style.background = gradient;
    }
    
    function getRandomColor() {
      var letters = '0123456789ABCDEF';
      var color = '#';
      for (var i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
      return color;
    }
  </script>
</body>
