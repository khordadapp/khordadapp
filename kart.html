    <style>
        /* استایل قالب */
        body {
            background-color: #3498db;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        /* استایل تکست ویو و دکمه */
        #numberInput {
            border: none;
            padding: 20px;
            border-radius: 5px;
            margin-right: 10px;
        }

        #verifyButton {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 20px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* استایل دیالوگ */
        .dialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-color: red;
            background-color: white;
            padding: 7%;
            border-radius: 10px;
            text-align: center;
            z-index: 9999;
        }

        .dialog img {
            max-width: 100%;
            height: auto;
            margin-bottom: 10px;
        }

        .closeButton {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<!-- تکست ویو و دکمه -->
<input type="text" id="numberInput" placeholder="شماره کارت عضویت">
<button onclick="verifyNumber()" id="verifyButton">درستی سنجی</button>

<!-- دیالوگ خطا -->

<div id="errorDialog" class="dialog">
    <img src="https://abrehamrahi.ir/o/public/ZcGxZd7Q/" alt="تصویر خطا">
<font color="red">کد وارد شده صحیح نمی باشد</font>
<br/>
       <p>    
    <button onclick="closeDialog('errorDialog')" class="closeButton">بستن</button>
</div>

<!-- دیالوگ عملیات انجام شد -->

<div id="successDialog" class="dialog">
    <img src="https://abrehamrahi.ir/o/public/BHtdhjpq/" alt="تصویر موفقیت">
<font color="green">کد کارت شما صحیح و معتبر می‌باشد</font>
<br/>
       <p>    
    <button onclick="closeDialog('successDialog')" class="closeButton">بستن</button>
</div>

<script>
    function verifyNumber() {
        var userInput = document.getElementById('numberInput').value;

        // بررسی اعداد مجاز
        var allowedNumbers = ['96578213', '28469753', '54635876', '11254638', '45690851'];
        if (allowedNumbers.includes(userInput)) {
            showDialog('successDialog');
        } else {
            showDialog('errorDialog');
        }
    }

    function showDialog(dialogId) {
        document.getElementById(dialogId).style.display = 'block';
    }

    function closeDialog(dialogId) {
        document.getElementById(dialogId).style.display = 'none';
    }
</script>
</div>

</body>
